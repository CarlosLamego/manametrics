<h2 mat-dialog-title>Novo Deck</h2>

<form [formGroup]="deckForm">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>

      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Formato</mat-label>

      <input matInput formControlName="format" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">
      Cancelar
    </button>

    <button mat-raised-button type="button" [disabled]="deckForm.invalid" (click)="save()">
      Salvar
    </button>
  </mat-dialog-actions>
</form>
