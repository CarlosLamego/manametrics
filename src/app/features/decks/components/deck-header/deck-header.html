<section class="deck-header">

  <h1>{{ deck().name }}</h1>

  <p>{{ deck().format }}</p>

  <div class="deck-colors">
    @for (color of deck().colors; track color) {
    <span class="color-chip">
      {{ color }}
    </span>
    }
  </div>

  <div class="deck-actions">
    <button type="button" (click)="onEditClick()">
      Editar Deck
    </button>
    <button type="button" (click)="onExportClick()">
      Exportar TXT
    </button>
  </div>

</section>
